variables:
  user: testuser
  email: testuser@example.com
  theme: dark
  editor: vim
  shell: bash
  hostname: test-machine

interpolation:
  include_patterns:
    - '*.conf'
    - '*.config'
    - '*.toml'
    - '*.yaml'
    - '*.yml'
    - '*.json'
    - '*.sh'
    - '*.bashrc'
    - '*.zshrc'
    - '*.vimrc'
    - '*.gitconfig'
  exclude_patterns:
    - '*.tmp'
    - '*.log'
    - '*.cache'
    - '.DS_Store'
    - '*.swp'
    - '*.swo'
